dataset: kb_documents
owner: support-ai
freshness:
  column: published_at
  max_delay_minutes: 60
  severity: warning
fields:
  doc_id: {required: true, type: string, severity: critical}
  version: {required: true, type: integer, severity: critical}
  effective_at: {required: true, type: datetime, severity: warning}
  published_at: {required: true, type: datetime, severity: warning}
  source_uri: {required: true, type: string, severity: warning}
  content: {required: true, type: string, min_length: 20, severity: warning}
