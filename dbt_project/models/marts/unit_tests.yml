version: 2

unit_tests:
  - name: completed_orders_sum_to_expected_revenue
    description: "Happy path: single active customer, revenue sums correctly. Demonstrates logic test vs data quality test."
    model: fct_daily_revenue
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: C0001, amount_usd: 100.0, status: completed, order_date: '2026-08-01'}
          - {order_id: 2, customer_id: C0001, amount_usd: 70.0, status: completed, order_date: '2026-08-01'}
          - {order_id: 3, customer_id: C0002, amount_usd: 50.0, status: pending, order_date: '2026-08-01'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0001, is_active: true}
          - {customer_id: C0002, is_active: true}
    expect:
      rows:
        - {order_date: '2026-08-01', completed_order_rows: 2, daily_revenue: 170.0}

  - name: revenue_inflation_with_duplicate_active_customers
    description: "SCD violation: duplicate active customer rows cause left join fanout. This test FAILS on current model, exposing inflation bug. Expected correct 2 rows/170 revenue."
    model: fct_daily_revenue
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: C0001, amount_usd: 100.0, status: completed, order_date: '2026-08-01'}
          - {order_id: 2, customer_id: C0001, amount_usd: 70.0, status: completed, order_date: '2026-08-01'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0001, is_active: true}
          - {customer_id: C0001, is_active: true}
    expect:
      rows:
        - {order_date: '2026-08-01', completed_order_rows: 2, daily_revenue: 170.0}

  - name: pending_orders_excluded_from_revenue
    description: "Only completed orders should count toward revenue."
    model: fct_daily_revenue
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: C0001, amount_usd: 200.0, status: pending, order_date: '2026-08-01'}
          - {order_id: 2, customer_id: C0001, amount_usd: 150.0, status: refunded, order_date: '2026-08-01'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0001, is_active: true}
    expect:
      rows: []

  - name: multiple_dates_aggregate_correctly
    description: "Revenue aggregates per order_date correctly."
    model: fct_daily_revenue
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: C0001, amount_usd: 100.0, status: completed, order_date: '2026-08-01'}
          - {order_id: 2, customer_id: C0002, amount_usd: 200.0, status: completed, order_date: '2026-08-02'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0001, is_active: true}
          - {customer_id: C0002, is_active: true}
    expect:
      rows:
        - {order_date: '2026-08-01', completed_order_rows: 1, daily_revenue: 100.0}
        - {order_date: '2026-08-02', completed_order_rows: 1, daily_revenue: 200.0}
